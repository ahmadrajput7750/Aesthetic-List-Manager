<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>List Manager</title>

    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/8161/8161879.png">

  <body>
    <div class="container">

    </div>

    <script src="script.js"></script>
  </body>
</html>
